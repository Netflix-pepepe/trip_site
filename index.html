<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🐺 人狼オンライン トリップ検索機</title>

<style>
:root{
  --bg:#f7f4fb;
  --card:#fff;
  --text:#252536;
  --muted:#77748a;
  --line:#e8e1f0;
  --pink:#f6c9dc;
  --lav:#d9cef3;
  --blue:#cfe8f7;
  --mint:#d9f0e7;
  --yellow:#fff0bd;
  --danger:#f8d5dc;
  --shadow:0 8px 24px rgba(94,72,116,.10);
}
*{box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:linear-gradient(180deg,#fbf8fd,var(--bg));
  color:var(--text);
  margin:0;
  padding:16px 12px 40px;
}
.wrap{max-width:850px;margin:auto}
.hero{
  background:linear-gradient(135deg,#fff,#f7effa,#edf6fb);
  border:1px solid #eee3f2;
  border-radius:24px;
  padding:22px 18px;
  box-shadow:var(--shadow);
}
.badge{
  display:inline-block;
  background:var(--pink);
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}
h1{font-size:27px;margin:10px 0 4px}
.subtitle{color:var(--muted);font-size:13px;line-height:1.7}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:17px;
  margin:14px 0;
  box-shadow:var(--shadow);
}
h2{font-size:19px;margin:0 0 8px}
label{
  display:block;
  font-weight:800;
  margin:13px 0 6px;
  font-size:14px;
}
input,select,button{font:inherit}
input,select{
  width:100%;
  padding:12px 13px;
  border:1px solid #ddd6e6;
  border-radius:13px;
  background:#fff;
  color:var(--text);
}
button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:13px 15px;
  margin-top:10px;
  font-weight:800;
  cursor:pointer;
}
.primary{background:linear-gradient(135deg,#e9b8d1,#d6c4ec)}
.secondary{background:#eef7fb}
.danger{background:var(--danger);color:#63343e}
.trip{
  font-size:25px;
  font-weight:900;
  word-break:break-all;
  margin:12px 0;
  background:#faf6fc;
  border:1px dashed #d9c9e5;
  border-radius:14px;
  padding:12px;
}
.help{
  background:linear-gradient(135deg,#eef8fc,#f7f1fb);
  border-radius:14px;
  padding:11px 13px;
  font-size:13px;
  color:#625c70;
  line-height:1.7;
}
.cond{
  border:1px solid #e8deee;
  border-radius:15px;
  padding:11px;
  margin:9px 0;
  background:#fdfaff;
}
.row{
  display:flex;
  gap:8px;
}
.row>*{flex:1}
.stat{
  color:#6f687c;
  margin-top:11px;
  font-variant-numeric:tabular-nums;
}
.result{
  padding:12px;
  margin-top:8px;
  border:1px solid #e7dfef;
  border-radius:14px;
  background:linear-gradient(90deg,#fff,#fbf7fd);
}
.result.special{
  border-color:#dfc37b;
  background:linear-gradient(90deg,#fffdf2,#fff8dc);
}
.mono{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.ok{color:#27825c}
.bad{color:#b23c50}
.small{font-size:12px;color:var(--muted)}
.special-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}
.special-grid label{
  margin:0;
  padding:9px;
  border:1px solid #e7dfef;
  border-radius:11px;
  background:#fff;
  font-weight:700;
}
.special-grid input{
  width:auto;
  margin-right:6px;
}
@media(max-width:600px){
  .row{flex-direction:column}
  .special-grid{grid-template-columns:1fr}
  h1{font-size:24px}
}
</style>
</head>

<body>
<div class="wrap">

<section class="hero">
  <span class="badge">🐺 CPU版・iPad対応</span>
  <h1>🐺 人狼オンライン<br>トリップ検索機</h1>
  <div class="subtitle">
    10桁・12桁トリップ生成 / 正規表現 / 特殊トリップ / 重複除外
  </div>
</section>

<!-- 生成 -->
<div class="card">
  <h2>🔑 トリップ生成</h2>

  <label>トリップキー</label>
  <input id="key" maxlength="12" value="passwordaa" autocomplete="off">

  <button class="primary" id="make">
    ✨ トリップを生成
  </button>

  <div class="trip" id="trip">◆—</div>

  <button class="secondary" id="copy">
    📋 トリップをコピー
  </button>
</div>

<!-- 検証 -->
<div class="card">
  <h2>🧪 自動検証</h2>
  <div id="tests">未実行</div>

  <button class="primary" id="runTests">
    🧪 4件を検証
  </button>
</div>

<!-- 検索 -->
<div class="card">

<h2>🔎 トリップ検索</h2>

<div class="help">
  複数条件を指定した場合は<strong>すべての条件</strong>に一致するものだけを検索します。<br>
  検索結果は同じトリップを自動的に重複除外します。
</div>

<label>キーの長さ</label>
<select id="tripLen">
  <option value="10" selected>10文字</option>
  <option value="12">12文字</option>
</select>

<label>検索方式</label>
<select id="searchMode">
  <option value="random">ランダム探索</option>
  <option value="sequential">順番に探索</option>
</select>

<label>最大試行回数</label>
<select id="attemptMode">
  <option value="unlimited" selected>♾️ 制限なし（停止するまで）</option>
  <option value="limited">回数を指定</option>
</select>

<input
  id="maxAttempts"
  type="number"
  min="1"
  value="1000000"
  style="display:none"
>

<label>一致条件</label>
<div id="conditions"></div>

<button class="secondary" id="add">
  ＋ 条件を追加
</button>

<!-- 正規表現 -->
<label>正規表現</label>

<input
  id="regex"
  placeholder="例：^(.)\1{4,}$"
  autocomplete="off"
>

<div class="small">
  . / [] / ? / * / + / {n,m} / () / | / \1 などJavaScript正規表現が使用できます。
</div>

<!-- 特殊 -->
<label>⭐ 特殊トリップ</label>

<div class="special-grid">

<label>
<input type="checkbox" value="pure8" class="special">
純8連
</label>

<label>
<input type="checkbox" value="pure9" class="special">
純9連
</label>

<label>
<input type="checkbox" value="pure10" class="special">
純10連
</label>

<label>
<input type="checkbox" value="jun9" class="special">
準9連
</label>

<label>
<input type="checkbox" value="jun10" class="special">
準10連
</label>

<label>
<input type="checkbox" value="niko" class="special">
二構
</label>

<label>
<input type="checkbox" value="saicho" class="special">
最長
</label>

<label>
<input type="checkbox" value="saitan" class="special">
最短
</label>

<label>
<input type="checkbox" value="yakumo" class="special">
八雲
</label>

<label>
<input type="checkbox" value="kagami" class="special">
鏡
</label>

<label>
<input type="checkbox" value="kaibun" class="special">
回文
</label>

<label>
<input type="checkbox" value="yamahiko" class="special">
山彦
</label>

<label>
<input type="checkbox" value="soren" class="special">
双連
</label>

<label>
<input type="checkbox" value="zensu" class="special">
全数
</label>

<label>
<input type="checkbox" value="tobiishi" class="special">
飛石
</label>

<label>
<input type="checkbox" value="kakuhi" class="special">
拡飛
</label>

</div>

<div class="row" style="margin-top:12px">
  <button class="primary" id="start">
    🔍 検索開始
  </button>

  <button class="danger" id="stop">
    ⏹ 検索停止
  </button>
</div>

<div class="stat" id="status">
  待機中
</div>

<div id="results"></div>

</div>
</div>

<!-- unixCrypt -->
<script src="./unix-crypt-td.min.js"></script>

<script>
"use strict";

/* =========================================================
   基本トリップ
========================================================= */

function saltForTrip(key){
  let s=(key+"H.").slice(1,3);

  s=s.replace(/[^\.-z]/g,'.');

  const table={
    ":":"A",
    ";":"B",
    "<":"C",
    "=":"D",
    ">":"E",
    "?":"F",
    "@":"G",
    "[":"a",
    "\\":"b",
    "]":"c",
    "^":"d",
    "_":"e",
    "`":"f"
  };

  s=s.replace(/[:;<=>?@[\\\]^_`]/g,c=>table[c]||c);

  return s;
}

function cryptAvailable(){
  return typeof unixCryptTD==="function";
}

function makeTrip(key){
  if(!cryptAvailable()){
    throw new Error(
      "unixCryptTD が読み込まれていません。unix-crypt-td.min.js を確認してください。"
    );
  }

  return "◆"+unixCryptTD(
    key,
    saltForTrip(key)
  ).slice(-10);
}

/* =========================================================
   生成
========================================================= */

document.getElementById("make").onclick=()=>{
  try{
    document.getElementById("trip").textContent=
      makeTrip(document.getElementById("key").value);
  }catch(e){
    document.getElementById("trip").textContent="❌ "+e.message;
  }
};

try{
  document.getElementById("trip").textContent=
    makeTrip(document.getElementById("key").value);
}catch(e){}

/* コピー */

document.getElementById("copy").onclick=async()=>{
  const t=document.getElementById("trip").textContent;

  if(!t.startsWith("◆")) return;

  try{
    await navigator.clipboard.writeText(t);
  }catch(e){
    alert("コピーできませんでした");
  }
};

/* =========================================================
   テスト
========================================================= */

const expected=[
  ["test123456","◆o9CDijBNYE"],
  ["hello12345","◆FQWl9PgQwg"],
  ["abcdef1234","◆E4hSdx1q4w"],
  ["passwordaa","◆ozOtJW9BFA"]
];

document.getElementById("runTests").onclick=()=>{
  const box=document.getElementById("tests");

  box.innerHTML="";

  let ok=0;

  for(const [k,want] of expected){

    let got;

    try{
      got=makeTrip(k);
    }catch(e){
      got=e.message;
    }

    const good=got===want;

    if(good)ok++;

    const div=document.createElement("div");

    div.className=good?"ok":"bad";

    div.innerHTML=
      `<b>${good?"✅":"❌"}</b>
       ${k} → ${got}
       / 正解 ${want}`;

    box.appendChild(div);
  }

  box.insertAdjacentHTML(
    "beforeend",
    `<hr><b>${ok}/4 一致</b>`
  );
};

/* =========================================================
   通常条件
========================================================= */

const conds=document.getElementById("conditions");

function addCondition(){

  const d=document.createElement("div");

  d.className="cond";

  d.innerHTML=`
    <div class="row">

      <input
        class="needle"
        placeholder="例：ABC"
        autocomplete="off"
      >

      <select class="mode">
        <option value="contains">部分一致</option>
        <option value="prefix">前方一致</option>
        <option value="suffix">後方一致</option>
      </select>

    </div>

    <button
      type="button"
      class="danger deleteCondition"
    >
      🗑️ この条件を削除
    </button>
  `;

  d.querySelector(".deleteCondition").onclick=()=>{
    d.remove();
  };

  conds.appendChild(d);
}

addCondition();
addCondition();

document.getElementById("add").onclick=addCondition;

/* =========================================================
   正規表現
========================================================= */

function regexMatches(trip,pattern){

  if(!pattern) return true;

  try{

    const re=new RegExp(pattern);

    return re.test(trip);

  }catch(e){

    throw new Error(
      "正規表現エラー："+e.message
    );
  }
}

/* =========================================================
   特殊トリップ判定
========================================================= */

function hasRun(t,n,ignoreCase=false){

  if(ignoreCase){

    t=t.toLowerCase();
  }

  for(let i=0;i<=t.length-n;i++){

    const s=t.slice(i,i+n);

    if(new Set(s).size===1){
      return true;
    }
  }

  return false;
}

function isPure(t,n){
  return hasRun(t,n,false);
}

function isJun(t,n){
  return hasRun(t,n,true);
}

function isNiko(t){
  return new Set(t).size===2;
}

function onlyChars(t,chars){
  return [...t].every(c=>chars.includes(c));
}

function isSaicho(t){
  return onlyChars(t,"MmW") &&
         new Set(t).size<=3;
}

function isSaitan(t){
  return onlyChars(t,"li.");
}

function isYakumo(t){

  if(t.length!==10 && t.length!==12){
    return false;
  }

  const groups=[];

  for(let i=0;i+2<t.length;i+=3){

    const s=t.slice(i,i+3);

    if(s.length===3 &&
       new Set(s.toLowerCase()).size===1){

      groups.push(s.toLowerCase());

    }else{

      return false;
    }
  }

  return groups.length>=3 &&
         new Set(groups).size===groups.length;
}

function isKagami(t){

  const mirrorMap={
    ".":".",
    "0":"0",
    "8":"8",
    "A":"A",
    "H":"H",
    "I":"I",
    "M":"M",
    "O":"O",
    "T":"T",
    "U":"U",
    "V":"V",
    "W":"W",
    "X":"X",
    "Y":"Y",

    "b":"d",
    "d":"b",

    "i":"i",
    "l":"l",
    "o":"o",
    "p":"q",
    "q":"p",
    "v":"v",
    "w":"w",
    "x":"x"
  };

  for(let i=0;i<t.length;i++){

    const a=t[i];
    const b=t[t.length-1-i];

    if(!mirrorMap[a] || mirrorMap[a]!==b){
      return false;
    }
  }

  return true;
}

function isKaibun(t){

  for(let i=0;i<t.length;i++){

    if(t[i]!==t[t.length-1-i]){
      return false;
    }
  }

  return true;
}

function isYamahiko(t){

  if(t.length%2!==0){
    return false;
  }

  const half=t.length/2;

  return t.slice(0,half)===
         t.slice(half);
}

function isSoren(t){

  if(t.length%2!==0){
    return false;
  }

  for(let i=0;i<t.length;i+=2){

    if(t[i]!==t[i+1]){
      return false;
    }
  }

  return true;
}

function isZensu(t){
  return /^[0-9]+$/.test(t);
}

function isTobiishi(t){

  for(let i=1;i<t.length;i+=2){

    if(t[i]!=="." && t[i]!=="/"){
      return false;
    }
  }

  return true;
}

function isKakuhi(t){

  for(let i=1;i<t.length;i+=2){

    if(t[i]!==t[1]){
      return false;
    }
  }

  return true;
}

function specialMatch(t,type){

  switch(type){

    case "pure8":
      return isPure(t,8);

    case "pure9":
      return isPure(t,9);

    case "pure10":
      return isPure(t,10);

    case "jun9":
      return isJun(t,9);

    case "jun10":
      return isJun(t,10);

    case "niko":
      return isNiko(t);

    case "saicho":
      return isSaicho(t);

    case "saitan":
      return isSaitan(t);

    case "yakumo":
      return isYakumo(t);

    case "kagami":
      return isKagami(t);

    case "kaibun":
      return isKaibun(t);

    case "yamahiko":
      return isYamahiko(t);

    case "soren":
      return isSoren(t);

    case "zensu":
      return isZensu(t);

    case "tobiishi":
      return isTobiishi(t);

    case "kakuhi":
      return isKakuhi(t);

    default:
      return false;
  }
}

/* =========================================================
   条件収集
========================================================= */

function collectConditions(){

  return [...document.querySelectorAll(".cond")]
    .map(c=>({

      text:c.querySelector(".needle").value
        .trim()
        .replace(/^◆/,""),

      mode:c.querySelector(".mode").value

    }))
    .filter(x=>x.text);
}

function getSpecials(){

  return [...document.querySelectorAll(".special:checked")]
    .map(x=>x.value);
}

/* =========================================================
   UI
========================================================= */

document.getElementById("attemptMode").onchange=()=>{

  const limited=
    document.getElementById("attemptMode").value==="limited";

  document.getElementById("maxAttempts").style.display=
    limited?"block":"none";
};

/* =========================================================
   Worker
========================================================= */

let worker=null;
let running=false;

document.getElementById("stop").onclick=()=>{

  if(worker){

    worker.postMessage({
      cmd:"stop"
    });

    setTimeout(()=>{

      if(worker){

        worker.terminate();
        worker=null;
      }

    },100);
  }

  running=false;

  document.getElementById("status").textContent=
    "⏹ 停止しました";
};

/* =========================================================
   検索開始
========================================================= */

document.getElementById("start").onclick=()=>{

  if(running) return;

  const conditions=collectConditions();
  const specials=getSpecials();

  const regexText=
    document.getElementById("regex").value.trim();

  if(
    !conditions.length &&
    !specials.length &&
    !regexText
  ){

    alert(
      "通常条件・正規表現・特殊トリップのいずれかを指定してください"
    );

    return;
  }

  if(regexText){

    try{
      new RegExp(regexText);
    }catch(e){
      alert("正規表現エラー："+e.message);
      return;
    }
  }

  const tripLen=
    Number(document.getElementById("tripLen").value);

  const attemptMode=
    document.getElementById("attemptMode").value;

  const maxAttempts=
    Number(document.getElementById("maxAttempts").value);

  if(
    attemptMode==="limited" &&
    (!Number.isInteger(maxAttempts)||maxAttempts<1)
  ){

    alert("最大試行回数を確認してください");

    return;
  }

  if(worker){

    worker.terminate();
    worker=null;
  }

  document.getElementById("results").innerHTML="";

  running=true;

  document.getElementById("status").textContent=
    "🔎 検索開始…";

  /*
    Workerは外部CDNをimportしない。
    同じGitHub Pages上のtrip-worker.jsを使う。
  */

  worker=new Worker("./trip-worker.js");

  worker.onmessage=e=>{

    const d=e.data;

    if(d.type==="progress"){

      document.getElementById("status").textContent=
        `🔎 ${d.attempts.toLocaleString()} keys`+
        ` / ${d.rate.toLocaleString()} keys/sec`+
        ` / ユニーク ${d.unique.toLocaleString()}`+
        ` / 重複 ${d.duplicate.toLocaleString()}`;
    }

    if(d.type==="hit"){

      const r=document.createElement("div");

      r.className=
        "result"+(d.special?" special":"");

      r.innerHTML=`

        <div class="mono">
          ${escapeHTML(d.trip)}
        </div>

        <div>
          キー：
          <span class="mono">
            ${escapeHTML(d.key)}
          </span>
        </div>

        ${
          d.special
          ?
          `<div class="small">⭐ ${escapeHTML(d.special)}</div>`
          :
          ""
        }

      `;

      document.getElementById("results")
        .appendChild(r);
    }

    if(d.type==="done"){

      running=false;

      document.getElementById("status").textContent=
        `✅ 完了 / ${d.attempts.toLocaleString()} keys`+
        ` / ${d.rate.toLocaleString()} keys/sec`+
        ` / ユニーク ${d.unique.toLocaleString()}`+
        ` / 重複 ${d.duplicate.toLocaleString()}`;

      if(worker){

        worker.terminate();
        worker=null;
      }
    }

    if(d.type==="error"){

      running=false;

      document.getElementById("status").textContent=
        "❌ Workerエラー："+d.message;

      if(worker){

        worker.terminate();
        worker=null;
      }
    }
  };

  worker.onerror=e=>{

    running=false;

    console.error("Worker error:",e);

    document.getElementById("status").textContent=
      "❌ Workerエラー："+e.message;

    if(worker){

      worker.terminate();
      worker=null;
    }
  };

  worker.postMessage({

    cmd:"start",

    tripLen,

    searchMode:
      document.getElementById("searchMode").value,

    unlimited:
      attemptMode==="unlimited",

    maxAttempts:
      attemptMode==="unlimited"
      ?0
      :maxAttempts,

    conditions,

    regexText,

    specials
  });
};

/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHTML(s){

  return String(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
</script>

</body>
</html>
