<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>🐺 人狼オンライン トリップ検索機</title>

<style>
:root{
  --bg:#f7f4fb;
  --card:#fff;
  --text:#252536;
  --muted:#77748a;
  --line:#e8e1f0;
  --pink:#f6c9dc;
  --lav:#d9cef3;
  --blue:#cfe8f7;
  --mint:#d9f0e7;
  --danger:#f8d5dc;
  --shadow:0 8px 24px rgba(94,72,116,.10);
}

*{box-sizing:border-box}

body{
  font-family:-apple-system,BlinkMacSystemFont,
    "Hiragino Sans","Yu Gothic",sans-serif;
  background:linear-gradient(180deg,#fbf8fd 0%,var(--bg) 100%);
  color:var(--text);
  margin:0;
  padding:18px 14px 36px;
}

.wrap{
  max-width:820px;
  margin:auto;
}

.hero{
  background:linear-gradient(
    135deg,#fff,#f7effa 55%,#edf6fb
  );
  border:1px solid #eee3f2;
  border-radius:24px;
  padding:24px 20px;
  box-shadow:var(--shadow);
  margin-bottom:16px;
}

.badge{
  display:inline-block;
  background:var(--pink);
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}

h1{
  font-size:28px;
  margin:10px 0 4px;
}

.subtitle{
  color:var(--muted);
  font-size:14px;
  line-height:1.7;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
  margin:14px 0;
  box-shadow:var(--shadow);
}

h2{
  font-size:19px;
  margin:0 0 8px;
}

.section-note{
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
  margin:0 0 12px;
}

label{
  display:block;
  font-weight:800;
  margin:14px 0 6px;
  font-size:14px;
}

input,select,button{
  font:inherit;
}

input,select{
  width:100%;
  padding:13px 14px;
  border:1px solid #ddd6e6;
  border-radius:13px;
  background:#fff;
  color:var(--text);
  outline:none;
}

input:focus,select:focus{
  border-color:#c7b4df;
  box-shadow:0 0 0 3px #efe7f8;
}

button{
  border:0;
  border-radius:13px;
  padding:13px 16px;
  margin-top:12px;
  font-weight:800;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.primary{
  background:linear-gradient(135deg,#e9b8d1,#d6c4ec);
  color:#30283a;
}

.secondary{
  background:#eef7fb;
  color:#33404a;
}

.danger{
  background:var(--danger);
  color:#63343e;
}

.row{
  display:flex;
  gap:9px;
}

.row>*{
  flex:1;
}

.trip{
  font-size:25px;
  font-weight:900;
  word-break:break-all;
  margin:13px 0;
  background:#faf6fc;
  border:1px dashed #d9c9e5;
  border-radius:14px;
  padding:13px;
}

.ok{
  color:#27825c;
}

.bad{
  color:#b23c50;
}

.stat{
  font-variant-numeric:tabular-nums;
  color:#6f687c;
  margin-top:10px;
}

.cond{
  border:1px solid #e8deee;
  border-radius:15px;
  padding:11px;
  margin:9px 0;
  background:#fdfaff;
}

.result{
  padding:12px;
  margin-top:9px;
  border:1px solid #e7dfef;
  border-radius:14px;
  background:linear-gradient(90deg,#fff,#fbf7fd);
}

.mono{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}

.help{
  background:linear-gradient(135deg,#eef8fc,#f7f1fb);
  border-radius:14px;
  padding:11px 13px;
  font-size:13px;
  color:#625c70;
  line-height:1.7;
}

.special-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.special{
  margin:0;
  text-align:left;
  background:#f8f3fc;
  border:1px solid #e5dcef;
}

.special.active{
  background:#ead9f4;
  border-color:#c6a9db;
}

#results{
  max-height:600px;
  overflow:auto;
}

hr{
  border:0;
  border-top:1px solid #eee8f2;
  margin:12px 0;
}

@media(max-width:600px){
  body{
    padding:12px 10px 28px;
  }

  .hero{
    padding:20px 16px;
  }

  h1{
    font-size:25px;
  }

  .row{
    flex-direction:column;
    gap:0;
  }

  .special-grid{
    grid-template-columns:1fr;
  }

  button{
    min-height:46px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<section class="hero">
  <span class="badge">🐺 CPU版・iPad対応</span>

  <h1>
    🐺 人狼オンライン<br>
    トリップ検索機
  </h1>

  <div class="subtitle">
    10桁・12桁トリップ検索 / 正規表現 / 特殊トリップ対応
  </div>
</section>


<!-- トリップ生成 -->

<div class="card">

<h2>🔑 トリップ生成</h2>

<p class="section-note">
  #を入れずにキーを入力してください。
</p>

<label>トリップキー</label>

<input
  id="key"
  maxlength="10"
  value="passwordaa"
  autocomplete="off"
>

<button class="primary" id="make">
✨ トリップを生成
</button>

<div class="trip" id="trip">◆—</div>

<button class="secondary" id="copy">
📋 トリップをコピー
</button>

</div>


<!-- テスト -->

<div class="card">

<h2>🧪 自動検証</h2>

<p class="section-note">
計算結果が正しいか確認します。
</p>

<div id="tests">
未実行
</div>

<button class="primary" id="runTests">
🧪 4件を検証
</button>

</div>


<!-- 検索 -->

<div class="card">

<h2>🔎 トリップ検索</h2>

<div class="help">
複数条件を指定すると、<b>すべての条件</b>に一致するトリップを検索します。
</div>


<label>トリップ長</label>

<select id="tripLen">
  <option value="10">10文字</option>
  <option value="12">12文字</option>
</select>


<label>検索モード</label>

<select id="searchMode">

  <option value="normal">
    通常検索
  </option>

  <option value="regex">
    🔤 正規表現
  </option>

</select>


<label>特殊トリップ</label>

<div class="special-grid">

<button class="special" data-special="pure">
純n連
</button>

<button class="special" data-special="semi">
準n連
</button>

<button class="special" data-special="two">
二構
</button>

<button class="special" data-special="long">
最長
</button>

<button class="special" data-special="short">
最短
</button>

<button class="special" data-special="yakumo">
八雲
</button>

<button class="special" data-special="mirror">
鏡
</button>

<button class="special" data-special="palindrome">
回文
</button>

<button class="special" data-special="echo">
山彦
</button>

<button class="special" data-special="double">
双連
</button>

<button class="special" data-special="number">
全数
</button>

<button class="special" data-special="stepping">
飛石
</button>

<button class="special" data-special="wideStepping">
拡飛
</button>

</div>


<label>検索条件</label>

<div id="conditions"></div>

<button class="secondary" id="add">
＋ 条件を追加
</button>


<div class="row">

<button class="primary" id="start">
🔍 検索開始
</button>

<button class="danger" id="stop">
⏹ 停止
</button>

</div>


<div class="stat" id="status">
待機中
</div>

<div id="results"></div>

</div>

</div>


<script src="./unix-crypt-td.min.js"></script>

<script>

"use strict";


/* =========================
   共通
========================= */

let worker = null;

let searchRunning = false;

let selectedSpecial = "";


/* =========================
   トリップ生成
========================= */

function saltForTrip(key){

  let s = (key + "H.").slice(1,3);

  s = s.replace(/[^\.-z]/g,".");

  s = s.replace(/[\:;<=>?@[\\\]^_`]/g,c=>{

    const table={
      ":":"A",
      ";":"B",
      "<":"C",
      "=":"D",
      ">":"E",
      "?":"F",
      "@":"G",
      "[":"a",
      "\\":"b",
      "]":"c",
      "^":"d",
      "_":"e",
      "`":"f"
    };

    return table[c] || c;

  });

  return s;
}


function makeTrip(key){

  if(typeof unixCryptTD !== "function"){

    throw new Error(
      "unixCryptTD が読み込まれていません"
    );

  }

  return "◆" +
    unixCryptTD(
      key,
      saltForTrip(key)
    ).slice(-10);
}


/* =========================
   初期トリップ
========================= */

try{

  document.getElementById("trip").textContent =
    makeTrip(
      document.getElementById("key").value
    );

}catch(e){

  console.error(e);

}


/* =========================
   生成
========================= */

document.getElementById("make").onclick=()=>{

  try{

    const key =
      document.getElementById("key").value;

    document.getElementById("trip").textContent =
      makeTrip(key);

  }catch(e){

    document.getElementById("trip").textContent =
      "❌ " + e.message;

  }

};


/* =========================
   コピー
========================= */

document.getElementById("copy").onclick=async()=>{

  const t =
    document.getElementById("trip").textContent;

  if(!t.startsWith("◆")) return;

  try{

    await navigator.clipboard.writeText(t);

  }catch(e){

    alert("コピーできませんでした");

  }

};


/* =========================
   テスト
========================= */

const expected=[

  ["test123456","◆o9CDijBNYE"],

  ["hello12345","◆FQWl9PgQwg"],

  ["abcdef1234","◆E4hSdx1q4w"],

  ["passwordaa","◆ozOtJW9BFA"]

];


document.getElementById("runTests").onclick=()=>{

  const box =
    document.getElementById("tests");

  box.innerHTML="";

  let ok=0;

  for(const [k,want] of expected){

    let got;

    try{

      got=makeTrip(k);

    }catch(e){

      got=e.message;

    }

    const good=got===want;

    if(good) ok++;

    box.innerHTML += `

      <div class="${good?'ok':'bad'}">

        <b>${good?'✅':'❌'}</b>

        ${k}

        →

        ${got}

        /

        正解 ${want}

      </div>

    `;

  }

  box.innerHTML += `

    <hr>

    <b>${ok}/4 一致</b>

  `;

};


/* =========================
   条件
========================= */

const conds =
  document.getElementById("conditions");


function addCondition(){

  const d =
    document.createElement("div");

  d.className="cond";

  d.innerHTML=`

    <div class="row">

      <input
        class="needle"
        placeholder="例：ABC / A.*B / [0-9]{3}"
        autocomplete="off"
      >

      <select class="mode">

        <option value="contains">
          部分一致
        </option>

        <option value="prefix">
          前方一致
        </option>

        <option value="suffix">
          後方一致
        </option>

        <option value="exact">
          完全一致
        </option>

      </select>

    </div>

    <button
      type="button"
      class="danger deleteCondition"
    >
      🗑️ この条件を削除
    </button>

  `;


  d.querySelector(
    ".deleteCondition"
  ).onclick=()=>{

    d.remove();

  };


  conds.appendChild(d);

}


addCondition();


/* =========================
   特殊トリップ
========================= */

document.querySelectorAll(".special")
.forEach(btn=>{

  btn.onclick=()=>{

    document
      .querySelectorAll(".special")
      .forEach(x=>x.classList.remove("active"));

    if(selectedSpecial === btn.dataset.special){

      selectedSpecial="";

      return;

    }

    selectedSpecial =
      btn.dataset.special;

    btn.classList.add("active");

  };

});


/* =========================
   追加条件
========================= */

document.getElementById("add")
.addEventListener(
  "click",
  addCondition
);


/* =========================
   停止
========================= */

document.getElementById("stop").onclick=()=>{

  if(worker){

    worker.postMessage({
      cmd:"stop"
    });

    worker.terminate();

    worker=null;

  }

  searchRunning=false;

  document.getElementById("status")
    .textContent="⏹ 検索を停止しました";

};


/* =========================
   検索
========================= */

document.getElementById("start").onclick=()=>{

  if(worker){

    worker.terminate();

    worker=null;

  }


  const needles =
    [...document.querySelectorAll(".cond")]

    .map(c=>({

      text:
        c.querySelector(".needle").value.trim(),

      mode:
        c.querySelector(".mode").value

    }))

    .filter(x=>x.text);


  if(!needles.length){

    alert(
      "検索条件を1つ以上入力してください"
    );

    return;

  }


  const tripLen =
    Number(
      document.getElementById("tripLen").value
    );


  const searchMode =
    document.getElementById("searchMode").value;


  document.getElementById("results")
    .innerHTML="";


  document.getElementById("status")
    .textContent=
      "🔎 検索開始…";


  searchRunning=true;


  /* Worker */

  worker =
    new Worker(
      "./trip-worker.js"
    );


  worker.onmessage=e=>{

    const d=e.data;


    if(d.type==="ready"){

      worker.postMessage({

        cmd:"start",

        tripLen,

        needles,

        searchMode,

        special:selectedSpecial

      });

      return;

    }


    if(d.type==="progress"){

      document.getElementById("status")
        .textContent=
          `🔎 検索中… ${d.attempts.toLocaleString()} keys / `+
          `${d.rate.toLocaleString()} keys/sec / `+
          `ヒット ${d.found}`;

      return;

    }


    if(d.type==="hit"){

      const r =
        document.createElement("div");

      r.className="result";

      r.innerHTML=`

        <div class="mono">
          ${escapeHtml(d.item.trip)}
        </div>

        <div>
          キー：

          <span class="mono">
            ${escapeHtml(d.item.key)}
          </span>
        </div>

      `;

      document
        .getElementById("results")
        .appendChild(r);

      return;

    }


    if(d.type==="done"){

      searchRunning=false;

      document.getElementById("status")
        .textContent=
          `✅ 完了：${d.attempts.toLocaleString()} keys / `+
          `${d.rate.toLocaleString()} keys/sec / `+
          `ヒット ${d.found}`;

      worker.terminate();

      worker=null;

      return;

    }


    if(d.type==="error"){

      searchRunning=false;

      document.getElementById("status")
        .textContent=
          "❌ Workerエラー：" + d.message;

    }

  };


  worker.onerror=e=>{

    console.error(
      "Worker error:",
      e
    );

    searchRunning=false;

    document.getElementById("status")
      .textContent=
        "❌ Workerエラー：" +
        (e.message || "読み込み失敗");

  };

};


function escapeHtml(s){

  return String(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

</body>
</html>
